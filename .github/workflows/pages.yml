name: Pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fail_build:
        description: 'Acceptance test: fail before uploading; keep the live site unchanged'
        type: boolean
        default: false

concurrency:
  group: pages-deployment
  queue: max

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      # Official v6 refs resolved through GitHub on 2026-11-12.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - run: python scripts/build.py
      - run: node --check src/app.js


  frontend:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      # Official v6 ref resolved on 2026-11-12; test-only Node runtime.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          PYTHON: python
      - run: python scripts/build.py --synthetic --output "$RUNNER_TEMP/progress-dashboard-preview"
      # DOM tests and synthetic builds never publish artifacts or deploy.

  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - run: python scripts/assert_empty.py
      - run: python scripts/build.py
      - name: Verify failure protection on explicit manual request
        if: github.event_name == 'workflow_dispatch' && inputs.fail_build
        run: python -c "raise SystemExit('Intentional build failure; deployment must be skipped')"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, frontend, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Reject superseded runs and deployed descendants
        id: guard
        run: python scripts/pages_guard.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy checked empty site
        if: steps.guard.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
